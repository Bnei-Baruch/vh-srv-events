services:
  vh-srv-events:
    image: "${IMAGE_NAME}"
    container_name: 'vh-srv-events'
    restart: unless-stopped
    env_file: .env
    cpus: '0.5'
    mem_limit: 250M
    ports:
      # Bound to loopback: host nginx is the only thing that talks to this, and
      # firewalld is disabled on the Rocky 9 hosts, so a 0.0.0.0 mapping would
      # publish the service straight onto the VM's public IP, bypassing the
      # edge LB and nginx entirely.
      #
      # Host 7475 -> container 8080. nginx upstreams must target 7475; Kong's
      # service table said 8080 because it reached containers over the docker
      # network rather than through a published port.
      - 127.0.0.1:7475:8080
networks:
  default:
    name: vh
    external: true
