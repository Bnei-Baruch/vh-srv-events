name: CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Matches the on-prem vh-db (PG 18) so version differences surface in CI
        # rather than during the cutover window.
        image: postgres:18
        env:
          POSTGRES_DB: events_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.21'

      - name: Run tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: events_test
          DB_SSLMODE: disable
          APP_ENV: test
          APP_MODE: debug
        run: |
          go mod download
          set -o pipefail
          go test -v -race -coverprofile=coverage.out ./... | tee test.log
          go tool cover -func=coverage.out

      - name: Upload test log on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 7

  build:
    needs: test
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set SHORT_SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bnei-baruch/vh-srv-events:latest
            ghcr.io/bnei-baruch/vh-srv-events:${{ env.SHORT_SHA }}
          build-args: |
            GIT_SHA=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Set environment variables
        run: |
          # Explicit per-environment selection with no fall-through. The previous
          # if/else sent anything that was not "production" to the staging host,
          # so a new option would have silently deployed to the wrong VM.
          case "${{ inputs.environment }}" in
            production)     echo "SSH_HOST=${{ secrets.VH_HOST_PRODUCTION }}"     >> $GITHUB_ENV ;;
            staging)        echo "SSH_HOST=${{ secrets.VH_HOST_STAGING }}"        >> $GITHUB_ENV ;;
            *) echo "Unknown environment: ${{ inputs.environment }}" >&2; exit 1 ;;
          esac
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
          echo "DEPLOY_ENV=${{ inputs.environment }}" >> $GITHUB_ENV

      - name: Copy docker-compose.yml to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: root
          key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          # The on-prem VMs are only reachable through the bastion.
          proxy_host: ${{ secrets.SSH_PROXY_HOST }}
          proxy_username: ${{ secrets.SSH_PROXY_USERNAME }}
          proxy_key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: /root/vh-docker/apps/vh-srv-events/

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: root
          key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          # The on-prem VMs are only reachable through the bastion.
          proxy_host: ${{ secrets.SSH_PROXY_HOST }}
          proxy_username: ${{ secrets.SSH_PROXY_USERNAME }}
          proxy_key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          envs: SHORT_SHA,DEPLOY_ENV
          script: |
            set -e
            cd /root/vh-docker/apps/vh-srv-events

            if [ ! -f .env ]; then
              echo "ERROR: .env file missing at /root/vh-docker/apps/vh-srv-events/.env"
              exit 1
            fi

            export IMAGE_NAME=ghcr.io/bnei-baruch/vh-srv-events:$SHORT_SHA

            # No staging-DB choreography: staging now uses the shared vh-db host
            # (pgsql4) like production, so the on-box eventsdb container and its
            # /opt/srv-events-db seed mount are gone.

            docker compose pull vh-srv-events
            docker compose up -d --remove-orphans

            # Health check: /health requires auth, so 401 means service is up
            sleep 5
            for i in 1 2 3; do
              HTTP_CODE=$(curl -so /dev/null -w '%{http_code}' http://localhost:7475/health || true)
              if [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed (HTTP $HTTP_CODE)"
                exit 0
              fi
              echo "Health check attempt $i: HTTP $HTTP_CODE, retrying in 5s..."
              sleep 5
            done
            echo "WARNING: health check failed after 3 attempts"
            docker logs vh-srv-events --tail 20
